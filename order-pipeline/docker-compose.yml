version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: order-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    # TODO-7: Add a healthcheck so the consumer waits for Postgres to be ready
    # before it starts consuming. Use `pg_isready` as the test command.

volumes:
  order_pg_data:
